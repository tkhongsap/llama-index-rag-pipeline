name: orion_gl_monthly
description: Orion general ledger monthly summary aggregation for RAG ingestion.
text_template: |
  Period {period} recorded GL account {gl_account} ({gl_name_en}) in cost center {cost_center} ({cost_center_name})
  under internal order {order_number}. The ledger captured {transaction_count} postings across
  {unique_documents} unique documents with types {document_types}. Total local currency movement was {total_amount}
  THB with an average posting of {avg_amount} THB. Cost center context: {cost_center_description}. Internal
  order description: {io_description}. Source file {source_file} at aggregation level {aggregation_level}.
field_mappings:
  - csv_column: period
    metadata_key: period
    field_type: identifier
    data_type: string
    required: true
  - csv_column: gl_acct
    metadata_key: gl_account
    field_type: identifier
    data_type: string
    required: true
  - csv_column: gl_name_en
    metadata_key: gl_name_en
    field_type: generic
    data_type: string
  - csv_column: gl_name_th
    metadata_key: gl_name_th
    field_type: generic
    data_type: string
  - csv_column: cost_center
    metadata_key: cost_center
    field_type: identifier
    data_type: string
    required: true
  - csv_column: cost_center_name
    metadata_key: cost_center_name
    field_type: generic
    data_type: string
  - csv_column: cost_center_description
    metadata_key: cost_center_description
    field_type: generic
    data_type: string
  - csv_column: order_number
    metadata_key: order_number
    field_type: identifier
    data_type: string
    required: true
  - csv_column: io_description
    metadata_key: io_description
    field_type: generic
    data_type: string
  - csv_column: total_amount
    metadata_key: total_amount
    field_type: generic
    data_type: numeric
  - csv_column: avg_amount
    metadata_key: avg_amount
    field_type: generic
    data_type: numeric
  - csv_column: transaction_count
    metadata_key: transaction_count
    field_type: generic
    data_type: numeric
  - csv_column: unique_documents
    metadata_key: unique_documents
    field_type: generic
    data_type: numeric
  - csv_column: document_types
    metadata_key: document_types
    field_type: generic
    data_type: string
  - csv_column: aggregation_level
    metadata_key: aggregation_level
    field_type: generic
    data_type: string
  - csv_column: source_file
    metadata_key: source_file
    field_type: generic
    data_type: string
  - csv_column: created_at
    metadata_key: aggregated_at
    field_type: generic
    data_type: string
