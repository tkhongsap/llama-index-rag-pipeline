name: orion_actual_sale
description: Orion actual sale summary aggregated by cost element, internal order, and material code.
text_template: |
  Period {period} captured cost element {cost_element} ({cost_element_name}) on internal order {order_number} with
  material {material_code} ({material_description}). The aggregation summarises {transaction_count} postings with
  {unique_documents} unique documents and types {document_types}. Total recognised amount: {total_amount} THB with
  average posting {avg_amount} THB. Source file {source_file} at level {aggregation_level} created at {aggregated_at}.
field_mappings:
  - csv_column: period
    metadata_key: period
    field_type: identifier
    data_type: string
    required: true
  - csv_column: cost_element
    metadata_key: cost_element
    field_type: identifier
    data_type: string
    required: true
  - csv_column: cost_element_name
    metadata_key: cost_element_name
    field_type: generic
    data_type: string
  - csv_column: cost_element_descr
    metadata_key: cost_element_description
    field_type: generic
    data_type: string
  - csv_column: order_number
    metadata_key: order_number
    field_type: identifier
    data_type: string
    required: true
  - csv_column: material_code
    metadata_key: material_code
    field_type: identifier
    data_type: string
    required: true
  - csv_column: material_description
    metadata_key: material_description
    field_type: generic
    data_type: string
  - csv_column: io_description
    metadata_key: io_description
    field_type: generic
    data_type: string
  - csv_column: total_amount
    metadata_key: total_amount
    field_type: generic
    data_type: numeric
  - csv_column: avg_amount
    metadata_key: avg_amount
    field_type: generic
    data_type: numeric
  - csv_column: transaction_count
    metadata_key: transaction_count
    field_type: generic
    data_type: numeric
  - csv_column: unique_documents
    metadata_key: unique_documents
    field_type: generic
    data_type: numeric
  - csv_column: document_types
    metadata_key: document_types
    field_type: generic
    data_type: string
  - csv_column: aggregation_level
    metadata_key: aggregation_level
    field_type: generic
    data_type: string
  - csv_column: source_file
    metadata_key: source_file
    field_type: generic
    data_type: string
  - csv_column: created_at
    metadata_key: aggregated_at
    field_type: generic
    data_type: string
